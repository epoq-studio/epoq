<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Topotrainer</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: één scherm-app. Thuis = route + tegels; spelen = kaart boven, vraagpaneel onder (telefoon) of rechts (breed). Atlaskleuren: zee, land, inkt. */
:root{
  --bg:#eef3f6;          /* papier met een vleugje zee */
  --surface:#ffffff;
  --ink:#14263a;         /* atlas-inkt */
  --muted:#5b6b7c;
  --line:#d3dde5;
  --accent:#e2572b;      /* stadsstip-rood */
  --accent-ink:#ffffff;
  --sea:#a9d8ef;
  --land:#ece7dc;
  --land-line:#b9b2a3;
  --shape-line:#6e7f8f;
  --water:#3d9bd6;
  --ok:#1f9d55;
  --ok-soft:#dff3e7;
  --bad:#d23c3c;
  --bad-soft:#fbe2e2;
  --warn:#c98a0b;
  --warn-soft:#fbf0d6;
  --hl:#ff8a1f;
  --font-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --shape-op:.92;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1a24; --surface:#172532; --ink:#e8eef3; --muted:#9aabba; --line:#2a3b4b;
    --accent:#ff6a3d; --accent-ink:#1a0d06;
    --sea:#1d4560; --land:#2b3540; --land-line:#45525e; --shape-line:#8597a8; --water:#5bb6f0;
    --ok:#3cc57a; --ok-soft:#173826; --bad:#ff6b6b; --bad-soft:#3d1c1f; --warn:#f0b43a; --warn-soft:#3a2f14; --hl:#ffa040;
    --shape-op:.55; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1a24; --surface:#172532; --ink:#e8eef3; --muted:#9aabba; --line:#2a3b4b;
  --accent:#ff6a3d; --accent-ink:#1a0d06;
  --sea:#1d4560; --land:#2b3540; --land-line:#45525e; --shape-line:#8597a8; --water:#5bb6f0;
  --ok:#3cc57a; --ok-soft:#173826; --bad:#ff6b6b; --bad-soft:#3d1c1f; --warn:#f0b43a; --warn-soft:#3a2f14; --hl:#ffa040;
  --shape-op:.55; color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.1}
.num{font-variant-numeric:tabular-nums}
.app{height:100%;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;display:flex;flex-direction:column}

/* ---------- thuis ---------- */
.home{overflow-y:auto;padding-inline:16px;padding-block:18px 40px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:1.65rem;font-weight:800;letter-spacing:-.01em}
.brand .dot{width:14px;height:14px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent)}
.who{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px 6px 6px;font-weight:600}
.who .av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--bg);font-family:var(--font-display);font-size:.9rem}
.next{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:end;position:relative;overflow:hidden}
.next .eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.next h2{font-size:clamp(1.5rem,4.5vw,2.2rem);font-weight:800;margin-top:6px}
.next .meta{color:var(--muted);margin-top:8px}
.next .coords{position:absolute;right:18px;top:14px;font-size:.72rem;color:var(--muted);letter-spacing:.04em}
.btn{border:0;border-radius:12px;padding:13px 20px;font-weight:700;background:var(--accent);color:var(--accent-ink);font-size:1.02rem;white-space:nowrap}
.btn:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.small{padding:8px 13px;font-size:.92rem;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
@media (max-width:560px){.next{grid-template-columns:1fr}.next .btn{width:100%}}
.route h3,.tiles h3{font-size:1.05rem;margin-bottom:10px}
.route-rows{display:grid;gap:8px}
.leg{display:grid;grid-template-columns:92px 1fr;gap:10px;align-items:center}
.leg .lname{font-weight:700;font-size:.92rem;color:var(--muted)}
.stops{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stop{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 9px;text-align:left;min-height:56px;display:flex;flex-direction:column;justify-content:space-between;gap:2px}
.stop .sn{font-size:.72rem;color:var(--muted);font-weight:700}
.stop .st{font-size:.82rem;line-height:1.15;font-weight:600}
.stop.done{background:var(--ok-soft);border-color:transparent}
.stop.done .sg{font-family:var(--font-display);font-weight:800;color:var(--ok)}
.stop.cur{border:2px solid var(--accent)}
.stop.locked{opacity:.55}
.stop.exam .st::before{content:"Toets · ";color:var(--accent)}
.tile-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:520px){.tile-row{grid-template-columns:1fr}.leg{grid-template-columns:1fr}.stops{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;text-align:left;display:flex;align-items:center;gap:12px}
.tile svg{flex:none;width:52px;height:52px}
.tile b{display:block;font-family:var(--font-display);font-size:1.1rem}
.tile small{color:var(--muted)}
.links{display:flex;gap:10px;flex-wrap:wrap}
.note{color:var(--muted);font-size:.9rem}

/* ---------- spelen ---------- */
.play{position:relative}
.play-head{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.play-head .t{min-width:0;flex:1}
.play-head .t b{display:block;font-family:var(--font-display);font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.play-head .t span{font-size:.8rem;color:var(--muted)}
.xbtn{border:1px solid var(--line);background:transparent;border-radius:10px;width:38px;height:38px;display:grid;place-items:center;font-size:1.1rem;flex:none}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:6px;transition:width .3s}
.phases{display:flex;gap:6px;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.phases span{color:var(--muted)}
.phases span.on{color:var(--accent)}
.play-body{flex:1;min-height:0;display:flex;flex-direction:column}
@media (min-width:900px) and (min-height:520px){.play-body{flex-direction:row}.panel{width:380px;border-left:1px solid var(--line);border-top:0!important}}
.mapbox{flex:1;min-height:0;position:relative;background:var(--sea);touch-action:none}
.mapbox svg{width:100%;height:100%;display:block}
.zoomctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.zoomctl button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:1.1rem}
.panel{background:var(--surface);border-top:1px solid var(--line);padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;overflow-y:auto;max-height:52%}
@media (min-width:900px) and (min-height:520px){.panel{max-height:none}}
.q-kicker{font-size:.76rem;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.q-text{font-family:var(--font-display);font-size:1.35rem;font-weight:700;line-height:1.2}
.q-text b{color:var(--accent)}
.q-sub{color:var(--muted);font-size:.92rem}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 10px;font-weight:600;text-align:left;display:flex;gap:8px;align-items:center;min-height:50px}
.opt kbd{font-family:var(--font-body);font-size:.72rem;border:1px solid var(--line);border-radius:5px;padding:0 5px;color:var(--muted)}
.opt.ok{background:var(--ok-soft);border-color:var(--ok)}
.opt.bad{background:var(--bad-soft);border-color:var(--bad)}
.typerow{display:flex;gap:8px}
.typerow input{flex:1;min-width:0;font:inherit;font-size:1.1rem;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fb{border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.fb.ok{background:var(--ok-soft)}
.fb.bad{background:var(--bad-soft)}
.fb.warn{background:var(--warn-soft)}
.fb .ic{font-family:var(--font-display);font-weight:800;font-size:1.15rem;flex:none}
.fb.ok .ic{color:var(--ok)}.fb.bad .ic{color:var(--bad)}.fb.warn .ic{color:var(--warn)}
.fb p{margin:0}
.fb .tip{color:var(--muted);font-size:.92rem;margin-top:4px}
.fb .go{margin-left:auto;flex:none;position:relative;border:0;background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:700;overflow:hidden}
.fb .go i{position:absolute;left:0;bottom:0;height:3px;background:var(--ink);opacity:.35;width:0}
@media (max-width:560px){.fb{flex-wrap:wrap}.fb>div{flex:1;min-width:0}.fb .go{width:100%;padding:11px}}
.spell del{color:var(--bad);text-decoration:line-through}
.spell ins{color:var(--ok);text-decoration:none;font-weight:700}
.card-name{font-family:var(--font-display);font-size:2rem;font-weight:800;line-height:1}
.card-kind{color:var(--muted);font-weight:600}
.card-coord{font-size:.8rem;color:var(--muted);letter-spacing:.03em}
.card-tip{background:var(--bg);border-radius:12px;padding:10px 12px}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-weight:600;font-size:.9rem;z-index:5;max-width:90%;text-align:center}
.clock{font-family:var(--font-display);font-weight:800;font-size:1.4rem}

/* kaart */
.m-base{fill:var(--land);stroke:var(--land-line);stroke-width:.6;vector-effect:non-scaling-stroke}
.m-shape{stroke:var(--shape-line);stroke-width:.8;vector-effect:non-scaling-stroke;fill-opacity:var(--shape-op);transition:fill .2s}
.m-shape.ghost{fill:none!important;stroke:none}
.m-shape.overlay{fill-opacity:.35;stroke-dasharray:4 3}
.m-shape.waterpoly{fill:var(--water)!important;fill-opacity:.9;stroke:none}
.m-shape.waterpoly.dim{fill-opacity:.45}
.m-line{fill:none;stroke:var(--water);stroke-width:2.2;vector-effect:non-scaling-stroke;stroke-linecap:round}
.m-shape.hl{fill:var(--hl)!important;fill-opacity:.85;stroke:var(--ink);stroke-width:2.2;stroke-dasharray:none}
.m-shape.ghost.hl{fill:var(--hl)!important;fill-opacity:.45!important;stroke:var(--ink);stroke-width:2}
.m-line.hl{stroke:var(--hl);stroke-width:5}
.m-shape.okc{fill:var(--ok)!important;fill-opacity:.75;stroke:var(--ok);stroke-width:2}
.m-shape.ghost.okc{fill:var(--ok)!important;fill-opacity:.35!important}
.m-shape.badc{fill:var(--bad)!important;fill-opacity:.65;stroke:var(--bad);stroke-width:2}
.m-shape.ghost.badc{fill:var(--bad)!important;fill-opacity:.3!important}
.m-line.okc{stroke:var(--ok);stroke-width:5}.m-line.badc{stroke:var(--bad);stroke-width:5}
.m-shape.click,.m-line.click{cursor:pointer}
.m-pt{fill:var(--ink);stroke:var(--surface);stroke-width:1.5;vector-effect:non-scaling-stroke}
.m-pt.capital{fill:var(--accent)}
.m-pt.hl{fill:var(--hl);stroke:var(--ink);stroke-width:2.5}
.m-pt.okc{fill:var(--ok)}.m-pt.badc{fill:var(--bad)}
.m-wave{fill:none;stroke:var(--water);stroke-width:2;vector-effect:non-scaling-stroke;stroke-linecap:round}
.m-wave.hl{stroke:var(--hl);stroke-width:3.5}.m-wave.okc{stroke:var(--ok);stroke-width:3.5}.m-wave.badc{stroke:var(--bad);stroke-width:3.5}
.m-mark{fill:none;stroke:var(--ink);stroke-width:1.5;vector-effect:non-scaling-stroke;stroke-dasharray:3 2;opacity:.7}
.m-mark.hl{stroke:var(--hl);stroke-width:3;opacity:1;stroke-dasharray:none}
.m-mark.okc{stroke:var(--ok);stroke-width:3;opacity:1;stroke-dasharray:none}.m-mark.badc{stroke:var(--bad);stroke-width:3;opacity:1;stroke-dasharray:none}
.m-cand{fill:color-mix(in srgb,var(--hl) 18%,transparent);stroke:var(--hl);stroke-width:2.5;vector-effect:non-scaling-stroke;cursor:pointer}
.m-pulse{fill:none;stroke:var(--hl);stroke-width:3;vector-effect:non-scaling-stroke}
@media (prefers-reduced-motion:no-preference){.m-pulse{animation:pulse 1.4s ease-out infinite}}
@keyframes pulse{0%{opacity:1}100%{opacity:0}}
.m-lbl{font-family:var(--font-body);font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:3.5px;stroke-linejoin:round;pointer-events:none}
.m-lbl.faint{opacity:.55;font-weight:600}
.m-lbl.okc{fill:var(--ok)}.m-lbl.badc{fill:var(--bad)}.m-lbl.hl{fill:var(--ink)}

/* resultaten & overzicht */
.res{overflow-y:auto;padding-inline:16px;padding-block:22px 40px}
.grade{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.grade .g{font-family:var(--font-display);font-weight:800;font-size:4.6rem;line-height:.9}
.grade .g.good{color:var(--ok)}.grade .g.mid{color:var(--warn)}.grade .g.low{color:var(--bad)}
.stats{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted)}
.stats b{display:block;font-family:var(--font-display);font-size:1.3rem;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border-radius:999px;padding:4px 10px;font-size:.88rem;font-weight:600;background:var(--bg);border:1px solid var(--line)}
.chip.g{background:var(--ok-soft);border-color:transparent}
.chip.o{background:var(--warn-soft);border-color:transparent}
.chip.r{background:var(--bad-soft);border-color:transparent}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.box h3{font-size:1.1rem}
.ms{display:flex;flex-direction:column;gap:6px}
.ms-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ms-top span{color:var(--muted)}
.ms-top span b{color:var(--ink)}
.bar2{display:flex;height:12px;background:var(--line);border-radius:6px;overflow:hidden}
.bar2 i{display:block;height:100%}
.bar2 .vast{background:var(--ok)}
.bar2 .geleerd{background:color-mix(in srgb,var(--ok) 35%,transparent)}
.key{display:flex;gap:16px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.key i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-2px}
.record{font-weight:700;color:var(--accent)}

/* modals */
.modal-bg{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 45%,transparent);display:grid;place-items:center;padding:16px;z-index:20}
.modal{background:var(--surface);border-radius:18px;padding:20px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:14px;max-height:90vh;overflow-y:auto}
.modal h2{font-size:1.4rem}
.seg{display:grid;gap:8px}
.seg button{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;text-align:left}
.seg button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--bg))}
.seg button small{display:block;color:var(--muted)}
.seg button:disabled{opacity:.45}
.profiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.profiles button{border:1.5px solid var(--line);background:var(--bg);border-radius:16px;padding:20px 12px;display:flex;flex-direction:column;align-items:center;gap:10px;font-weight:700}
.profiles .av{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--bg);font-family:var(--font-display);font-size:1.5rem}
</style>

<style>html,body{margin:0}</style>
</head>
<body>
<div class="app" id="app"></div>

    const d=this.load(); if (!API) return true;
    try {
      const r=await fetch(API+"/profiles",{cache:"no-store"}); const list=await r.json();
      if (Array.isArray(list) && list.length){ d.list=list; for (const x of list){ if(!d.profiles[x.id]) d.profiles[x.id]=newProfile(x.name); d.profiles[x.id].name=x.name; } }
      for (const id of Object.keys(d.profiles)) if (!d.list.some(x=>x.id===id)) delete d.profiles[id];
      if (d.current && !d.profiles[d.current]) d.current=null;
      this.local();
      if (d.current) await this.pull(d.current);
      return true;
    } catch(e){ return d.list.length>0; }
  },
  async pull(id){
    if (!API) return;
    try {
      const r=await fetch(API+"/p/"+id,{cache:"no-store"}); const srv=await r.json();
      const d=this.load(); const loc=d.profiles[id];
      if (srv && srv.items && (!loc || (srv.updated||0) >= (loc.updated||0))){ srv.name = loc ? loc.name : srv.name; d.profiles[id]=srv; this.local(); }
      else if (loc && (loc.updated||0) > ((srv&&srv.updated)||0)) { this.dirty=true; this.flush(); }
    } catch(e){}
  },
  save(){ // na elke wijziging: meteen lokaal, kort daarna naar de Worker
    const d=this.load(); const p=d.profiles[d.current]; if (p) p.updated=Date.now();
    this.local(); if (!API||!d.current) return;
    this.dirty=true; clearTimeout(this.timer); this.timer=setTimeout(()=>this.flush(),1500);
  },
  async flush(keepalive){
    const d=this.load(); if (!API||!this.dirty||!d.current) return;
    clearTimeout(this.timer); const id=d.current; const body=JSON.stringify(d.profiles[id]);
    try { const r=await fetch(API+"/p/"+id,{method:"PUT",body,headers:{"Content-Type":"application/json"},keepalive:!!keepalive && body.length<60000});
      if (r.ok) this.dirty=false; } catch(e){ /* volgende keer opnieuw */ }
  }
};

function classify(map, r){
  const n=r.n, t=r.t, c=r.c;
  if (n==="Noordpool") return ["gebied","pool"];
  if (t==="Place") return ["stad","stad"];
  if (map==="nl"){
    if (t==="Admin1") return ["provincie","provincie"];
    if (ISLANDS.includes(n)) return ["gebied","waddeneiland"];
    if (n==="Veluwe") return ["gebied","natuurgebied"];
    if (c==="STM"||c==="STMD") return ["water","rivier"];
    if (c==="CNL") return ["water","kanaal"];
    if (c==="LK") return ["water","meer"];
    if (c==="CHNM") return ["water","zeearm"];
    return ["water","zee"];
  }
  if (map==="eu") return n==="Schotland" ? ["land","deel van het VK"] : ["land","land"];
  if (t==="Country") return ["land","land"];
  if (t==="Continent") return ["werelddeel","werelddeel"];
  if (c==="OCN") return ["oceaan","oceaan"];
  if (c==="STM") return ["water","rivier"];
  if (n==="Alaska") return ["gebied","staat"];
  return ["gebied","gebied"];
}
const slug = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
function decRing(str,f){ const a=str.split(",").map(Number), out=[]; let x=0,y=0; for(let i=0;i<a.length;i+=2){x+=a[i];y+=a[i+1];out.push([x/f,y/f]);} return out; }
function fixPolygon(rings){ if (d3.geoArea({type:"Polygon",coordinates:rings}) > 2*Math.PI) rings.forEach(r=>r.reverse()); return rings; }

const PASTEL = ["#f6c6a8","#bfe0b5","#f3e39a","#c9c4ef","#a9dcd6","#f4b9c9","#d8e6a3","#b9d3f2","#efcf9f","#d6bde8","#a8e0bd","#f7d3b4"];

      ll:[r.p[1], r.p[0]], lbl: r.l ? [r.l[1], r.l[0]] : null, geo:null, gtype:"point" };
    if (r.g){ it.geo = { type:"MultiPolygon", coordinates: r.g.map(p=>fixPolygon(p.map(s=>decRing(s,f)))) }; it.gtype="shape"; it.area=d3.geoArea(it.geo); }
    else if (r.ln){ it.geo = { type:"MultiLineString", coordinates: r.ln.map(s=>decRing(s,f)) }; it.gtype="line"; }

}

const MapView = (()=>{
  const views={}; let host, svg, gRoot, gBase, gShapes, gOver, gLines, gWater, gPts, gMarks, gFx, gLbl, zoom, cur=null, k=1, onClick=null;
  const R_PT=5.5, R_MARK=13, FONT=13;
  function view(map){
    if (views[map]) return views[map];
    const box={type:"MultiPoint",coordinates:MAPCFG[map].bbox};
    const proj=d3.geoMercator().fitWidth(1000,box);
    let b=d3.geoPath(proj).bounds(box); const t=proj.translate(); proj.translate([t[0]-b[0][0], t[1]-b[0][1]]);
    const H=Math.round(b[1][1]-b[0][1]); const path=d3.geoPath(proj);
    const v={proj,path,W:1000,H}; views[map]=v;
    for (const it of ITEMS.filter(i=>i.map===map)){
      it.px = proj(it.ll);
      if (it.geo){
        let bb=path.bounds(it.geo);
        // segmenten in px voor afstandsberekening (sprongen over de datumgrens overslaan)
        const lines = it.geo.type==="MultiPolygon" ? it.geo.coordinates.flat() : it.geo.coordinates;
        it.segs = lines.map(l=>l.map(p=>proj(p)));
        // vormen die ver buiten beeld doorlopen (Rijn, Maas, Rusland): alleen het zichtbare deel telt voor zoom en markering
        const inV=it.segs.flat().filter(p=>p&&p[0]>=0&&p[0]<=1000&&p[1]>=0&&p[1]<=H);
        if (inV.length && (bb[0][0]<-50||bb[0][1]<-50||bb[1][0]>1050||bb[1][1]>H+50)){
          bb=[[d3.min(inV,p=>p[0]),d3.min(inV,p=>p[1])],[d3.max(inV,p=>p[0]),d3.max(inV,p=>p[1])]];

const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/['’`´.\-–\s\/]/g,"");
const ALIAS = { "Zuidpool/Antarctica":["zuidpool","antarctica","antarctis"], "Washington D.C.":["washington","washingtondc"], "Volksrepubliek China":["china"],
  "'s-Hertogenbosch":["shertogenbosch","hertogenbosch"], "Verenigde Staten":["verenigdestatenvanamerika"] };
function lev(a,b){ const m=a.length,n=b.length; const d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]); for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return d[m][n]; }
function checkTyped(it, txt){
  const t=norm(txt); if(!t) return "fout";
  const ok=[norm(it.name), ...(ALIAS[it.name]||[])];
  if (ok.includes(t)) return "ok";
  if (ok.some(o=>o.length>=4 && lev(o,t)<=(o.length>=9?2:1))) return "bijna";
  return "fout";
}
function spellDiff(target, typed){ // simpele weergave: getypt doorgestreept, juist erachter

}
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// buren voor afleiders en hulpkandidaten
function nearest(it, pool, n){
  return pool.filter(id=>id!==it.id && I[id].name!==it.name).map(id=>[id,d3.geoDistance(I[id].ll,it.ll)]).sort((a,b)=>a[1]-b[1]).slice(0,n).map(x=>x[0]);
}
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; };

/* Eén vraag stellen. form: mc | help | point | type.  Resultaat: {res:'ok'|'bijna'|'fout'} */
async function ask(id, form, opt={}){

  const active=vis;
  const P=panel(); P.innerHTML="";
  const kicker = opt.kicker || "";
  let resolveAns; const answered=new Promise(res=>resolveAns=res);

    const pool = sameCat(it, [...new Set([...vis, ...itemsOf(it.map)])]);
    const known = sameCat(it, vis);

    if (dis.length<3) dis = [...dis, ...nearest(it, fallbackPool(it), 6).filter(x=>!dis.includes(x))].slice(0,3);
    dis = shuffle(dis.slice(0,5)).slice(0,3);
    const opts = shuffle([id, ...dis]);
    MapView.setState({ visible: visPoints, active, cls:{[id]:"hl"}, pulse:[id] });
    MapView.focus([id]);
    P.appendChild(h(`<div><div class="q-kicker">${esc(kicker)}</div><div class="q-text">${NOUN[it.kind][1]} is dit?</div></div>`));
    const grid=h(`<div class="opts"></div>`);
    opts.forEach((o,i)=>{ const b=h(`<button class="opt" data-id="${o}"><kbd>${i+1}</kbd>${esc(I[o].name)}</button>`); b.onclick=()=>{ if(done) return; grid.querySelectorAll(".opt").forEach(x=>x.disabled=true);
        if(o===id){ b.classList.add("ok"); finish("ok"); } else { b.classList.add("bad"); grid.querySelector(`[data-id="${CSS.escape(id)}"]`).classList.add("ok"); finish("fout",{picked:o}); } };
      grid.appendChild(b); });
    P.appendChild(grid);

  }
  else if (form==="help" || form==="point"){
    let cands=null;
    if (form==="help"){
      const same=sameCat(it, vis); let nb=nearest(it, same, 2); if(nb.length<2) nb=[...nb, ...nearest(it, sameCat(it,itemsOf(it.map)), 4).filter(x=>!nb.includes(x))].slice(0,2);
      if(nb.length<2) nb=[...nb, ...nearest(it, fallbackPool(it), 4).filter(x=>!nb.includes(x))].slice(0,2);
      cands=shuffle([id,...nb]); window.__q.cands=cands;
    }
    const visible = form==="help" ? [...new Set([...visPoints, ...cands.filter(x=>I[x].gtype==="point")])] : visPoints;
    MapView.setState({ visible, active, cls:{}, cands: cands||[] , clickAll:true});
    if (form==="help") MapView.focus(cands, {minSpan: it.map==="nl"?520:300}); else if (opt.keepZoom!==true) MapView.reset();
    P.appendChild(h(`<div><div class="q-kicker">${esc(kicker)}</div><div class="q-text">Wijs aan: <b>${esc(nameWithArt(it))}</b></div>
      ${form==="help"?`<div class="q-sub">Kies een van de drie omcirkelde plekken.</div>`:`<div class="q-sub">Tik op de kaart. Inzoomen mag.</div>`}</div>`));
    const row=h(`<div class="row"><button class="btn ghost small" id="idk">Weet ik niet</button></div>`); P.appendChild(row);
    row.querySelector("#idk").onclick=()=>finish("fout",{idk:true});
    const clickables = form==="help" ? cands : [...new Set([...vis, ...itemsOf(it.map).filter(x=>I[x].gtype!=="point")])];
    MapView.onClick=(x,y)=>{
      if (done) return; const ll=MapView.invert(x,y); const px=MapView.tolPx(); const tol=22*px;

        let best=null,bd=1e9;
        for(const c of cands){ const ci=I[c]; const d=Math.min(Math.hypot(x-ci.px[0],y-ci.px[1]), ci.gtype==="point"?1e9:MapView.dist(ci,x,y,ll)); if(d<bd||(d===0&&bd===0&&ci.area<I[best].area)){bd=d;best=c;} }
        if (bd>45*px){ toast("Tik op een van de omcirkelde plekken."); return; }
        return finish(best===id?"ok":"fout",{picked:best});
      }
      const identify=()=>{ // wat heeft ze aangeklikt?
        let best=null,bd=1e9;
        for (const c of clickables){ const ci=I[c]; if(ci.gtype==="point"||ci.marker){ const d=Math.hypot(x-ci.px[0],y-ci.px[1]); if(d<bd && d<=tol*(ci.cat==="water"||ci.cat==="oceaan"?2:1)){bd=d;best=c;} } }
        if (best) return best;
        const inside=clickables.filter(c=>I[c].gtype==="shape"&&d3.geoContains(I[c].geo,ll)).sort((a,b)=>{ // eerst zelfde soort, dan kleinste
          const sa=I[a].cat===it.cat?0:1, sb=I[b].cat===it.cat?0:1; return sa-sb || I[a].area-I[b].area; });
        if (inside.length) return inside[0];
        let lb=null, ld=tol; for (const c of clickables){ const ci=I[c]; if(ci.gtype==="line"||ci.gtype==="shape"){ const d=MapView.dist(ci,x,y,ll); if(d<ld){ld=d;lb=c;} } }
        return lb;
      };
      const picked=identify();
      let hit;
      if (it.gtype==="point"){ const mul = it.kind==="zee"||it.cat==="oceaan" ? 3.5 : it.kind==="meer"||it.kind==="zeearm" ? 1.8 : 1.2;
        hit = (picked===id) || (Math.hypot(x-it.px[0],y-it.px[1])<=tol*mul && (!picked || I[picked].gtype!=="point" || picked===id)); }
      else if (it.gtype==="line") hit = MapView.dist(it,x,y,ll) <= tol*0.9;
      else hit = MapView.dist(it,x,y,ll) <= (it.marker?tol*1.2:it.cat==="water"?tol*0.75:tol*0.35);
      if (hit) return finish("ok");
      if (!picked) return finish("fout",{missed:true});
      const near = ["stad","land","provincie"].includes(it.cat) && nearest(it, sameCat(it, itemsOf(it.map)), 2).includes(picked) && I[picked].cat===it.cat;
      finish(near && !opt.strict ? "bijna" : "fout", {picked, near});
    };
  }
  else if (form==="type"){
    MapView.setState({ visible: visPoints, active, cls:{[id]:"hl"}, pulse:[id] });
    MapView.focus([id]);
    P.appendChild(h(`<div><div class="q-kicker">${esc(kicker)}</div><div class="q-text">Hoe heet ${NOUN[it.kind][2]}?</div><div class="q-sub">Spelling telt, hoofdletters en accenten niet.</div></div>`));
    const row=h(`<form class="typerow" autocomplete="off"><input id="typed" type="text" autocapitalize="words" autocorrect="off" spellcheck="false" aria-label="Naam"><button class="btn" type="submit">Check</button></form>`);
    P.appendChild(row);
    const idk=h(`<div class="row"><button class="btn ghost small" type="button">Weet ik niet</button></div>`); P.appendChild(idk);
    const inp=row.querySelector("input"); setTimeout(()=>{ try{inp.focus({preventScroll:true});}catch(e){} },60);
    row.onsubmit=e=>{ e.preventDefault(); if(done||!inp.value.trim()) return; inp.disabled=true; const res=checkTyped(it, inp.value); finish(res,{typed:inp.value.trim()}); };
    idk.querySelector("button").onclick=()=>finish("fout",{idk:true});
  }

  const ans = await Promise.race([answered, new Promise((_,rej)=>{ r.wake=()=>rej(new Abort()); })]);
  r.keys=null; guard();
  await feedback(it, form, ans, opt);
  return ans;
}

async function feedback(it, form, ans, opt){
  const r=RUN; const P=panel();
  const cls = {[it.id]:"ok"}; const labels=[{id:it.id,cls:"okc",fs:15}];
  if (ans.picked && ans.picked!==it.id){ cls[ans.picked]="bad"; labels.push({id:ans.picked,cls:"badc",fs:14}); }
  const vis=visibleFor(it.map); const visPoints=vis.filter(x=>I[x].gtype==="point");
  MapView.setState({ visible:[...new Set([...visPoints, it.gtype==="point"?it.id:null, ans.picked&&I[ans.picked].gtype==="point"?ans.picked:null].filter(Boolean))], active:vis, cls, labels });
  if (ans.res!=="ok" && (form==="point")) MapView.focus([it.id, ...(ans.picked?[ans.picked]:[])], {minSpan: it.map==="nl"?600:320});
  // tekst
  let ic, msg, tone, tip="";
  if (ans.res==="ok"){ tone="ok"; ic="Goed"; msg = form==="type" ? esc(it.name) : ""; }
  else if (ans.res==="bijna"){
    tone="warn"; ic="Bijna";
    msg = form==="type" ? `Let op de spelling: ${spellDiff(it.name, ans.typed)}` : `Dat is ${esc(I[ans.picked].name)}, ${esc(it.name)} ligt er vlak naast.`;
    tip = tipFor(it);
  } else {
    tone="bad"; ic= ans.idk ? "Zo zit het" : "Niet goed";
    if (form==="type") msg = ans.idk ? `Dit is <b>${esc(it.name)}</b>.` : `Je typte ${spellDiff(it.name, ans.typed||"")}`;
    else if (form==="mc") msg = `Dit is <b>${esc(it.name)}</b>${ans.picked?`, niet ${esc(I[ans.picked].name)}`:""}.`;
    else msg = ans.idk ? `${esc(it.name)} is groen gemaakt op de kaart.` : ans.picked ? `Jij koos ${esc(dname(I[ans.picked]))}. ${esc(it.name)} is groen.` : `Daar ligt het niet. ${esc(it.name)} is groen.`;
    tip = tipFor(it);
  }
  const quick = ans.res==="ok";
  const wait = quick ? (r.fast? 350 : 650) : (r.fast ? 1400 : 3200);
  const fb=h(`<div class="fb ${tone}" role="status"><span class="ic">${ic}</span><div><p>${msg}</p>${tip?`<p class="tip">${esc(tip)}</p>`:""}</div>${quick?"":`<button class="go">Verder<i></i></button>`}</div>`);
  // laat de vraag staan, vervang knoppenrij
  P.querySelectorAll(".typerow,.row").forEach(x=>x.remove());
  P.appendChild(fb);
  const bar=fb.querySelector(".go i");
  if (bar && !matchMedia("(prefers-reduced-motion: reduce)").matches){ bar.animate([{width:"0%"},{width:"100%"}],{duration:wait,easing:"linear"}); }
  await new Promise((res,rej)=>{ let t=setTimeout(res,wait); const go=()=>{clearTimeout(t);res();};
    fb.onclick=go; r.keys=e=>{ if(e.key==="Enter"||e.key===" ") { e.preventDefault(); go(); } }; r.wake=()=>{clearTimeout(t);rej(new Abort());}; });
  r.keys=null; guard();
}
document.addEventListener("keydown",e=>{ if(RUN&&RUN.keys&&!(e.target&&e.target.tagName==="INPUT")) RUN.keys(e); });

// verkennen: kaartjes met elk nieuw item
async function explore(ids, groupNo, groupCount){
  const r=RUN;
  for (let i=0;i<ids.length;i++){
    guard(); const it=I[ids[i]]; r.introduced.add(it.id); MapView.show(it.map);
    const vis=visibleFor(it.map);
    const labels=[...vis.filter(x=>x!==it.id && r.introduced.has(x) && I[x].map===it.map).map(x=>({id:x,cls:"faint"})), {id:it.id,cls:"hl",fs:16}];
    MapView.setState({ visible: vis.filter(x=>I[x].gtype==="point"), active:vis, cls:{[it.id]:"hl"}, pulse:[it.id], labels });
    MapView.focus([it.id]);
    const P=panel(); P.innerHTML="";
    const tip=tipFor(it);
    P.appendChild(h(`<div style="display:flex;flex-direction:column;gap:10px">
      <div class="q-kicker">Nieuw · groepje ${groupNo} van ${groupCount}</div>
      <div><div class="card-name">${esc(it.name)}</div><div class="card-kind">${esc(it.kind==="deel van het VK"?"deel van het Verenigd Koninkrijk":it.kind)}</div></div>
      ${tip?`<div class="card-tip">${esc(tip)}</div>`:""}
      <div class="card-coord num">${coordTxt(it.ll)}</div>
      <div class="dots">${ids.map((_,j)=>`<i class="${j<=i?"on":""}"></i>`).join("")}</div>
    </div>`));
    const row=h(`<div class="row">${i>0?`<button class="btn ghost" id="prev">Vorige</button>`:""}<button class="btn" id="next">${i<ids.length-1?"Volgende":"Oefenen"}</button></div>`);
    P.appendChild(row);
    const back = await new Promise((res,rej)=>{ row.querySelector("#next").onclick=()=>res(false); const pv=row.querySelector("#prev"); if(pv) pv.onclick=()=>res(true);
      r.keys=e=>{ if(e.key==="Enter"||e.key==="ArrowRight") res(false); if(e.key==="ArrowLeft"&&i>0) res(true); }; r.wake=()=>rej(new Abort()); });
    r.keys=null;
    if (back) i-=2;
  }
}

async function intro(kicker, title, text, btn="Start"){
  guard(); const P=panel(); P.innerHTML="";
  P.appendChild(h(`<div style="display:flex;flex-direction:column;gap:8px"><div class="q-kicker">${esc(kicker)}</div><div class="q-text">${esc(title)}</div><p class="q-sub" style="margin:0">${text}</p></div>`));
  const b=h(`<button class="btn">${esc(btn)}</button>`); P.appendChild(b);
  await new Promise((res,rej)=>{ b.onclick=res; RUN.keys=e=>{ if(e.key==="Enter") res(); }; RUN.wake=()=>rej(new Abort()); }); RUN.keys=null; guard();
}

// ---------- oefenlus met niveaus ----------
// niveau 1 meerkeuze → 2 aanwijzen met hulp → 3 aanwijzen vrij → 4 typen → 5 onder de knie
const FORM_OF = {1:"mc",2:"help",3:"point",4:"type"};
async function practice(groups, opt={}){
  const r=RUN; const pool=new Map(); let qn=0, last=null, wrongRow=0, easy=0;
  const all=groups.flat(); const total=all.length + (opt.extra||[]).length;
  const add=(id,level,extra)=>{ if(!pool.has(id)) pool.set(id,{id,level,due:qn,wr:0,extra:!!extra}); };
  (opt.extra||[]).forEach(id=>add(id,2,true));
  let g=0;
  const mastered=()=>[...pool.values()].filter(e=>e.level>=5).length;
  const upd=()=>setProgress(mastered(), total, `${mastered()}/${total} onder de knie`);
  const cap = total*9 + 20;
  while (true){
    guard();
    // volgend groepje introduceren zodra het huidige minimaal 'aanwijzen met hulp' heeft gehaald
    const open=[...pool.values()].filter(e=>e.level<5);
    const openG=open.filter(e=>!e.extra);
    if (g<groups.length && (openG.length===0 || openG.every(e=>e.level>=3))){
      if (!opt.noExplore){ setPhases(r.phases, r.phaseLearn); await explore(groups[g], g+1, groups.length); }
      else groups[g].forEach(id=>r.introduced.add(id));
      groups[g].forEach(id=>add(id, opt.startLevel||1)); g++; upd(); continue;
    }
    if (!open.length || qn>=cap) break;
    let cands=open.filter(e=>e.due<=qn && e.id!==last); if(!cands.length) cands=open.filter(e=>e.id!==last); if(!cands.length) cands=open;
    cands.sort((a,b)=>a.due-b.due || a.level-b.level);
    const e=cands[0];
    let lvl=e.level; if (easy>0){ lvl=Math.min(lvl,2); easy--; }
    const ans=await ask(e.id, FORM_OF[lvl], { kicker: opt.kicker || "Oefenen" });
    qn++; last=e.id; r.stat(e.id).asked++;
    if (ans.res==="ok"){ e.level=Math.max(e.level, lvl+1); e.due=qn+2+Math.floor(Math.random()*3); wrongRow=0; }
    else if (ans.res==="bijna"){ e.due=qn+3; r.stat(e.id).near++; wrongRow=0; }
    else { e.level=Math.max(1,e.level-1); e.wr++; e.due=qn+3+Math.floor(Math.random()*2); r.stat(e.id).wrong++; wrongRow++; }
    if (wrongRow>=3){ easy=3; wrongRow=0; toast("Even een stapje terug: de volgende vragen zijn makkelijker."); }
    upd();
  }
}

// ---------- toetsvragen (zonder hulp) ----------
async function testRound(ids, opt={}){
  const r=RUN; const res={}; let score=0;
  for (let i=0;i<ids.length;i++){
    const id=ids[i]; setProgress(i, ids.length, `${i+1}/${ids.length}`);
    const form = opt.forms ? opt.forms(id,i) : (i%3===2 ? "type" : "point");
    const ans=await ask(id, form, { kicker: opt.kicker||"Toets", strict:true });
    res[id]=ans.res; score += ans.res==="ok"?1:ans.res==="bijna"?0.5:0;
    if (ans.res!=="ok") r.stat(id).wrong++;
  }
  setProgress(ids.length, ids.length, `${ids.length}/${ids.length}`);
  return { res, pct: ids.length? score/ids.length : 0 };
}

// ---------- sterktes (alleen geleide sessies) ----------
function itemRec(id){ const p=prof(); return p.items[id] || (p.items[id]={s:0,seen:0,last:0,r:0,w:0}); }
function bump(id, res, sessionNo){
  if (!RUN.guided) return;
  const rec=itemRec(id); if(!rec.seen) rec.seen=sessionNo;
  if (res==="ok"){ rec.s=Math.min(5,rec.s+1); rec.r++; } else if (res==="fout"){ rec.s=0; rec.w++; }
  rec.last=Date.now();
}
const seenIds = map => Object.keys(prof().items).filter(id=>I[id] && (!map||I[id].map===map) && prof().items[id].seen);
function weakest(ids, n){ const p=prof(); return ids.slice().sort((a,b)=>{ const A=p.items[a]||{s:0,last:0,w:0}, B=p.items[b]||{s:0,last:0,w:0}; return A.s-B.s || B.w-A.w || A.last-B.last; }).slice(0,n); }
function formForStrength(s){ return s<=1?"mc":s<=3?"point":"type"; }

function newRun(cfg){
  const r={ ...cfg, aborted:false, introduced:new Set(), knownBefore:new Set(), stats:{}, start:Date.now(), keys:null, wake:null };
  r.stat=id=>r.stats[id]||(r.stats[id]={asked:0,wrong:0,near:0});
  return r;
}

// ---------- sessie: leren ----------
async function runLearn(n, guided){
  const s=SESSIONS[n];
  RUN=newRun({ guided, sessionNo:n, map:s.map });
  const r=RUN;
  // kaart groeit mee: wat ze al eerder gehad heeft op deze kaart is zichtbaar
  seenIds(s.map).forEach(id=>r.knownBefore.add(id));
  if (!guided){ for (let m=1;m<n;m++){ const S=SESSIONS[m]; if(S.map===s.map&&S.groups) S.groups.flat().forEach(id=>r.knownBefore.add(id)); } }
  const newIds=s.groups.flat();
  const prev=seenIds(null).filter(id=>!newIds.includes(id));
  const warm = guided ? weakest(prev, 8) : [];
  r.phases = warm.length ? ["Opwarmer","Leren","Toets"] : ["Leren","Toets"];
  r.phaseLearn = warm.length?1:0;
  playScreen(`${n}. ${s.title}`);
  MapView.show(s.map); MapView.setState({visible:[...r.knownBefore].filter(x=>I[x].map===s.map&&I[x].gtype==="point"), active:[...r.knownBefore]});
  const wrongWarm=[];
  if (warm.length){
    setPhases(r.phases,0);
    await intro("Opwarmer", `${warm.length} vragen over wat je al hebt gehad`, "De lastigste eerst. Wat je nu fout doet, oefen je straks gewoon nog een keer.");
    for (let i=0;i<warm.length;i++){
      setProgress(i,warm.length,`${i+1}/${warm.length}`);
      const id=warm[i]; const rec=itemRec(id); r.knownBefore.add(id);
      const ans=await ask(id, formForStrength(rec.s), {kicker:"Opwarmer"});
      bump(id, ans.res, n); if (ans.res!=="ok") wrongWarm.push(id);
      Store.save();
    }
    MapView.show(s.map);
  }
  setPhases(r.phases, r.phaseLearn);
  await intro("Leren", `${newIds.length} nieuwe plekken`, `In ${s.groups.length} groepjes. Eerst bekijk je ze op de kaart, dan oefen je: herkennen, aanwijzen en zelf de naam typen. Je bent klaar als alles <b>onder de knie</b> is.`, "Bekijk het eerste groepje");
  await practice(s.groups, { extra: wrongWarm.filter(id=>I[id].map===s.map) });
  // eigen kaart-fouten uit de opwarmer van een andere kaart: kort herhalen
  const otherWrong=wrongWarm.filter(id=>I[id].map!==s.map);
  if (otherWrong.length){ await intro("Herhalen", "Nog even de fouten uit de opwarmer", `${otherWrong.length} plek${otherWrong.length>1?"ken":""} van een andere kaart.`, "Verder");
    await practice([otherWrong], { noExplore:true, startLevel:2, kicker:"Herhalen" }); MapView.show(s.map); }
  // minitoets
  setPhases(r.phases, r.phases.length-1);
  const testIds=shuffle(newIds).slice(0,10);
  await intro("Toets", "Minitoets: 10 vragen", "Zonder hulp, zoals op de echte toets: aanwijzen en typen. Hieruit komt je cijfer.", "Start de toets");
  r.fast=true;
  const t=await testRound(testIds, { kicker:"Minitoets" });
  // sterktes
  if (guided){
    for (const id of newIds){ const rec=itemRec(id); if(!rec.seen) rec.seen=n; rec.last=Date.now();
      const tr=t.res[id]; const st=r.stat(id);
      if (tr==="ok"){ rec.s=Math.max(rec.s,2); rec.r++; } else if (tr==="fout"){ rec.s=0; rec.w++; } else if (tr==="bijna"){ rec.s=Math.max(rec.s,1); }
      else rec.s = st.wrong>=3 ? 0 : Math.max(rec.s,1);
    }
    finishSession(n, t.pct);
  } else freeLog(s.map, "replay", t.pct, null);
  results({ title:`${n}. ${s.title}`, pct:t.pct, ids:newIds, testRes:t.res, guided, sessionNo:n });
}

// ---------- sessie: proeftoets / eindronde ----------
async function runExam(n, guided){
  const s=SESSIONS[n];
  RUN=newRun({ guided, sessionNo:n, map:s.map, showAll:true });
  const r=RUN;
  let ids;
  if (s.final){
    const pool = guided ? seenIds(null) : ITEMS.map(i=>i.id);
    ids = weakest(pool.length?pool:ITEMS.map(i=>i.id), 30);
    ids = ids.sort((a,b)=>["nl","eu","world"].indexOf(I[a].map)-["nl","eu","world"].indexOf(I[b].map));
  } else ids = shuffle(itemsOf(s.map));
  r.phases=["Toets","Herkansing"];
  playScreen(`${n}. ${s.title}`);
  MapView.show(s.final? I[ids[0]].map : s.map); MapView.setState({visible:ids.filter(x=>I[x].gtype==="point"&&I[x].map===MapView.cur), active:ids});
  setPhases(r.phases,0);
  await intro(s.final?"Eindronde":"Proeftoets", s.final?`${ids.length} vragen: je zwakste plekken`:`${ids.length} vragen: heel ${MAPCFG[s.map].label}`,
    s.final?"Door elkaar, van Nederland tot de wereld. Wat fout gaat oefen je daarna meteen.":"Net als de echte toets: alles door elkaar, zonder hulp. Wat fout gaat, oefen je daarna meteen nog een keer.", "Start");
  r.fast=true;
  const t=await testRound(ids, { kicker: s.final?"Eindronde":"Proeftoets", forms:(id,i)=> i%3===2 ? "type" : "point" });
  for (const id of ids) bump(id, t.res[id], n);
  if (guided) Store.save();
  const wrong=ids.filter(id=>t.res[id]!=="ok");
  r.fast=false;
  if (wrong.length){
    setPhases(r.phases,1);
    await intro("Herkansing", `${wrong.length} plek${wrong.length>1?"ken":""} nog even oefenen`, "Aanwijzen en typen tot het zit. Dit telt niet mee voor je cijfer.", "Oefenen");
    const groups = s.final ? ["nl","eu","world"].map(m=>wrong.filter(id=>I[id].map===m)).filter(g=>g.length) : [wrong];
    for (const g of groups){ await practice([g], { noExplore:true, startLevel:3, kicker:"Herkansing" }); }
  }
  if (guided) finishSession(n, t.pct); else freeLog(s.map||"all","replay",t.pct,null);
  results({ title:`${n}. ${s.title}`, pct:t.pct, ids, testRes:t.res, guided, sessionNo:n, exam:true });
}

function finishSession(n, pct){
  const p=prof(); const prev=p.done[n]; const g=gradeOf(pct);
  p.done[n] = { grade: prev ? Math.max(prev.grade, g) : g, first: prev ? prev.first : g, pct, date: Date.now(), sec: Math.round((Date.now()-RUN.start)/1000) };
  Store.save(); Store.flush();
}

// ---------- vrije training ----------
async function runFree(map, what, how){
  RUN=newRun({ guided:false, map, showAll:true });
  const r=RUN; let pool;
  const seen=seenIds(map);
  if (what==="seen") pool=seen; else if (what==="weak") pool=weakest(seen,15); else pool=itemsOf(map);
  const label=MAPCFG[map].label;
  const howLbl={quick:"Snel rondje",clock:"Tegen de klok",type:"Alleen typen"}[how];
  playScreen(`Extra oefenen · ${label}`); r.phases=[howLbl]; setPhases(r.phases,0);
  MapView.show(map);
  r.fast=true;
  if (how==="clock"){
    const points=pool; let okc=0, tot=0, endAt=0;
    MapView.setState({visible:points.filter(x=>I[x].gtype==="point"),active:points});
    await intro("Tegen de klok","Zoveel mogelijk goed in 60 seconden","Aanwijzen op de kaart. Een fout kost alleen tijd.","Start de klok");
    endAt=Date.now()+60000; let q=shuffle(points);
    const tick=setInterval(()=>{ const left=Math.max(0,Math.ceil((endAt-Date.now())/1000)); setProgress(60-left,60,`${left}s · ${okc} goed`); if(left<=0&&RUN===r){ r.timeUp=true; r.wake&&r.wake(); } },250);
    try{
      while (Date.now()<endAt){ if(!q.length) q=shuffle(points); const id=q.pop(); const ans=await ask(id,"point",{kicker:"Tegen de klok"}); tot++; if(ans.res==="ok") okc++; }
    } catch(e){ if(!(e instanceof Abort) || !r.timeUp) { clearInterval(tick); throw e; } }
    clearInterval(tick);
    if (!r.timeUp && r.aborted) return;
    r.aborted=false;
    freeLog(map,"clock",tot?okc/tot:0,okc);
    return results({ title:`${howLbl} · ${label}`, pct: tot?okc/tot:0, clock:okc, tot, ids:[], testRes:{}, guided:false, free:{map,how} });
  }
  const ids=shuffle(pool).slice(0,20);
  while (ids.length<20 && pool.length) ids.push(pool[Math.floor(Math.random()*pool.length)]);
  MapView.setState({visible:pool.filter(x=>I[x].gtype==="point"),active:pool});
  await intro(howLbl, `${ids.length} vragen · ${label}`, how==="type"?"Typ steeds de naam. Spelling telt, net als op de toets.":"Door elkaar: herkennen, aanwijzen en typen.", "Start");
  const forms = how==="type" ? ()=> "type" : (id,i)=> ["mc","point","point","type"][i%4];
  const t=await testRound(ids,{kicker:howLbl, forms});
  freeLog(map,how,t.pct,null);
  results({ title:`${howLbl} · ${label}`, pct:t.pct, ids, testRes:t.res, guided:false, free:{map,how} });
}
function freeLog(map, how, pct, clock){
  const p=prof(); p.free.count++; p.free.sec += Math.round((Date.now()-RUN.start)/1000);
  const key=`${map}|${how}`; const val = how==="clock" ? clock : Math.round(pct*1000)/10;
  RUN.prevRecord = p.free.records[key];
  if (p.free.records[key]===undefined || val>p.free.records[key]){ p.free.records[key]=val; RUN.newRecord = RUN.prevRecord!==undefined || val>0; }
  Store.save();
}

// ---------- resultaten ----------
function results(o){
  const r=RUN; RUN=null; const p=prof();
  const g=gradeOf(o.pct); const sec=Math.round((Date.now()-r.start)/1000);
  const chips=(o.ids.length?o.ids:[]).filter((v,i,a)=>a.indexOf(v)===i).map(id=>{ const st=r.stats[id]||{wrong:0,near:0}; const tr=o.testRes[id];
    const c = tr==="fout" ? "r" : (st.wrong>0||tr==="bijna") ? "o" : "g"; return {id,c}; });
  const order={r:0,o:1,g:2}; chips.sort((a,b)=>order[a.c]-order[b.c]);
  const back = o.guided ? Object.keys(p.items).filter(id=>o.ids.includes(id) && p.items[id].s===0) : chips.filter(c=>c.c==="r").map(c=>c.id);
  $app.innerHTML="";
  const recKey=o.free?`${o.free.map}|${o.free.how}`:null;
  const el=h(`<div class="screen res"><div class="wrap">
    <div class="topbar"><div class="brand"><span class="dot"></span><h1>Topotrainer</h1></div></div>
    <div><div class="q-kicker">${o.guided?"Sessie afgerond":"Extra oefenen · telt niet mee voor je route"}</div><h2 style="font-size:1.6rem;margin-top:4px">${esc(o.title)}</h2></div>
    <div class="grade">
      ${o.clock!==undefined ? `<div class="g good num">${o.clock}</div><div class="stats"><div><b class="num">${o.clock} goed</b>in 60 seconden</div><div><b class="num">${o.tot}</b>vragen</div></div>`
      : `<div class="g ${gradeCls(g)} num">${fmt(g)}</div><div class="stats"><div><b class="num">${Math.round(o.pct*100)}%</b>goed</div><div><b class="num">${mins(sec)} min</b>geoefend</div></div>`}
    </div>
    ${o.free && r.newRecord ? `<p class="record">Nieuw record! ${o.clock!==undefined?o.clock+" goed":Math.round(o.pct*100)+"%"}${r.prevRecord!==undefined?` (was ${r.prevRecord}${o.clock!==undefined?"":"%"})`:""}</p>` : ""}
    ${o.free && !r.newRecord && recKey && p.free.records[recKey]!==undefined ? `<p class="note">Je record: ${p.free.records[recKey]}${o.clock!==undefined?" goed":"%"}</p>`:""}
    ${chips.length?`<div class="box"><h3>Per plek</h3>
      <div class="legend"><span><i style="background:var(--ok)"></i>meteen goed</span><span><i style="background:var(--warn)"></i>moeite mee gehad</span><span><i style="background:var(--bad)"></i>fout in de toets</span></div>
      <div class="chips">${chips.map(c=>`<span class="chip ${c.c}">${esc(dname(I[c.id]))}</span>`).join("")}</div></div>`:""}
    ${back.length?`<div class="box"><h3>${o.guided?"Deze komen volgende keer terug":"Deze nog even goed bekijken"}</h3><div class="chips">${back.map(id=>`<span class="chip r">${esc(dname(I[id]))}</span>`).join("")}</div></div>`:""}
    <div class="links"><button class="btn" id="home">Naar het overzicht</button>${o.free?`<button class="btn ghost" id="again">Nog een keer</button>`:""}</div>
  </div></div>`);
  $app.appendChild(el);
  el.querySelector("#home").onclick=home;
  const ag=el.querySelector("#again"); if(ag) ag.onclick=()=>start(()=>runFree(o.free.map, lastFree.what, o.free.how));
}

// ---------- schermen: thuis, profiel, overzicht ----------
function nextSession(){ const p=prof(); for (let n=1;n<SESSIONS.length;n++) if(!p.done[n]) return n; return null; }
function start(fn){ fn().catch(e=>{ if(e instanceof Abort) return; console.error(e); RUN=null; home(); }); }
const MINI = { // kleine silhouet-iconen voor de tegels
  nl:`<svg viewBox="0 0 52 52" aria-hidden="true"><rect width="52" height="52" rx="12" fill="var(--sea)"/><path d="M18 40l-3-8 4-6-1-7 6-6 4 3 7-6 5 3-1 8 3 5-4 4 1 7-5 1-3 5-5-3-5 3z" fill="#f3e39a" stroke="var(--shape-line)" stroke-width="1"/><circle cx="24" cy="24" r="2.2" fill="#e2572b"/></svg>`,
  eu:`<svg viewBox="0 0 52 52" aria-hidden="true"><rect width="52" height="52" rx="12" fill="var(--sea)"/><path d="M9 30l5-4 2-6 6-2 3-6 6 1 4-5 5 3 3 7-3 6 2 6-6 3-3 6-6-2-4 3-5-2-5 2z" fill="#bfe0b5" stroke="var(--shape-line)" stroke-width="1"/><circle cx="25" cy="26" r="2.2" fill="#e2572b"/></svg>`,
  world:`<svg viewBox="0 0 52 52" aria-hidden="true"><rect width="52" height="52" rx="12" fill="var(--sea)"/><circle cx="26" cy="26" r="16" fill="none" stroke="var(--shape-line)" stroke-width="1"/><path d="M14 20l6-3 5 2 1 5-3 4-5-1zM28 14l7 2 4 6-3 4-6-2-2-5zM24 31l5 1 2 5-4 4-3-4z" fill="#c9c4ef" stroke="var(--shape-line)" stroke-width="1"/></svg>`
};
let lastFree={what:"seen"};
function home(){
  RUN=null; const d=Store.load();
  if (!d.current || !d.profiles[d.current]) return pickProfile();
  const p=prof(); const nx=nextSession();
  $app.innerHTML="";
  const s=nx?SESSIONS[nx]:null;
  const nItems = s ? (s.groups ? s.groups.flat().length : s.exam ? itemsOf(s.map).length : 30) : 0;
  const legs=[["nl",[1,2,3,4]],["eu",[5,6,7,8]],["world",[9,10,11,12]],["all",[13]]];
  const el=h(`<div class="screen home"><div class="wrap">
    <div class="topbar"><div class="brand"><span class="dot"></span><h1>Topotrainer</h1></div>
      <button class="who" id="who"><span class="av">${esc(p.name[0])}</span>${esc(p.name)}</button></div>
    ${s?`<section class="next">
      <span class="coords num">${s.map?coordTxt(I[sessionItems(s)[0]].ll):"52,4° NB · 4,9° OL"}</span>
      <div><div class="eyebrow">Volgende sessie · ${nx} van 13 · ${s.map?MAPCFG[s.map].label:"alles"}</div>
      <h2>${esc(s.title)}</h2>
      <div class="meta">${s.groups?`${nItems} nieuwe plekken · ${seenIds(null).length?"opwarmer, leren":"leren"} en een minitoets · ± 20 min`:s.exam?`${nItems} vragen zoals op de toets, daarna herkansing · ± 15 min`:"Je 30 zwakste plekken door elkaar · ± 15 min"}</div></div>
      <button class="btn" id="go">Start sessie ${nx}</button></section>`
    :`<section class="next"><div><div class="eyebrow">Route klaar</div><h2>Alle 13 sessies gedaan</h2><div class="meta">Blijf scherp met extra oefenen hieronder, of doe een sessie opnieuw.</div></div></section>`}
    <section class="route"><h3>Jouw route</h3><div class="route-rows">
      ${legs.map(([m,ns])=>`<div class="leg"><div class="lname">${m==="all"?"Speling":MAPCFG[m].label}</div><div class="stops">
        ${ns.map(n=>{ const S=SESSIONS[n]; const dn=p.done[n]; const cur=n===nx; const locked=!dn&&!cur&&!p.unlockAll;
          return `<button class="stop ${dn?"done":""} ${cur?"cur":""} ${locked?"locked":""} ${S.exam?"exam":""}" data-n="${n}" ${locked?"disabled":""}>
            <span class="sn">${n}${dn?` · <span class="sg num">${fmt(dn.grade)}</span>`:""}</span><span class="st">${esc(S.exam?MAPCFG[S.map].label:S.title)}</span></button>`; }).join("")}
      </div></div>`).join("")}
    </div><p class="note" style="margin:8px 0 0">Klaar met een sessie? Tik erop om hem nog eens te doen. Dat telt als extra oefenen.</p></section>
    <section class="tiles"><h3>Extra oefenen</h3><div class="tile-row">
      ${["nl","eu","world"].map(m=>{ const recs=["quick","clock","type"].map(k=>p.free.records[`${m}|${k}`]).filter(v=>v!==undefined);
        const best=p.free.records[`${m}|clock`];
        return `<button class="tile" data-m="${m}">${MINI[m]}<span><b>${MAPCFG[m].label}</b><small>${best!==undefined?`Record: ${best} goed in 60 s`:recs.length?`Record: ${Math.max(...recs.map(Number))}%`:"Nog geen record"}</small></span></button>`; }).join("")}
    </div></section>
    <div class="links"><button class="btn ghost" id="ov">Mijn overzicht</button></div>
  </div></div>`);
  $app.appendChild(el);
  el.querySelector("#who").onclick=async()=>{ await Store.flush(); pickProfile(); };
  const go=el.querySelector("#go"); if(go) go.onclick=()=>launchSession(nx,true);
  el.querySelectorAll(".stop").forEach(b=>b.onclick=()=>{ const n=+b.dataset.n; if(p.done[n]) launchSession(n,false); else launchSession(n,true); });
  el.querySelectorAll(".tile").forEach(b=>b.onclick=()=>freeSetup(b.dataset.m));
  el.querySelector("#ov").onclick=overview;
}
function launchSession(n, guided){ const S=SESSIONS[n]; start(()=> S.groups ? runLearn(n,guided) : runExam(n,guided)); }

function pickProfile(){
  const d=Store.load(); $app.innerHTML="";
  const el=h(`<div class="screen home"><div class="wrap" style="max-width:480px">
    <div class="brand"><span class="dot"></span><h1>Topotrainer</h1></div>
    <p class="note" style="margin:0">Aardrijkskunde HV2: Nederland, Europa en de wereld. Wie gaat er oefenen?</p>
    ${d.list.length?`<div class="profiles">${d.list.map(x=>`<button data-k="${esc(x.id)}"><span class="av">${esc(x.name[0])}</span>${esc(x.name)}</button>`).join("")}</div>`
      :`<p>De profielen konden niet geladen worden. Controleer de internetverbinding en <a href="">laad de pagina opnieuw</a>.</p>`}
    <p class="note">Iedereen heeft een eigen route en eigen records.</p>
  </div></div>`);
  $app.appendChild(el);
  el.querySelectorAll("[data-k]").forEach(b=>b.onclick=async()=>{ d.current=b.dataset.k; Store.local(); b.disabled=true; await Store.pull(d.current); home(); });
}

function freeSetup(map){
  const seen=seenIds(map);
  let what = seen.length>=4 ? lastFree.what : "all"; if (what==="weak" && seen.length<5) what="all"; if (what==="seen"&&seen.length<4) what="all";
  let how="quick";
  const m=h(`<div class="modal-bg"><div class="modal" role="dialog" aria-label="Extra oefenen">
    <div><div class="q-kicker">Extra oefenen · telt niet mee voor je route</div><h2>${MAPCFG[map].label}</h2></div>
    <div><div class="q-kicker" style="margin-bottom:6px">Wat</div><div class="seg" id="what">
      <button data-v="seen" ${seen.length<4?"disabled":""}>Wat ik al gehad heb<small>${seen.length<4?"Hier heb je nog geen sessie van gedaan":`${seen.length} plekken`}</small></button>
      <button data-v="all">De hele kaart<small>${itemsOf(map).length} plekken, ook wat nog moet komen</small></button>
      <button data-v="weak" ${seen.length<5?"disabled":""}>Mijn lastigste 15<small>${seen.length<5?"Komt na je eerste sessie":"Wat je het vaakst fout had"}</small></button></div></div>
    <div><div class="q-kicker" style="margin-bottom:6px">Hoe</div><div class="seg" id="how">
      <button data-v="quick">Snel rondje<small>20 vragen door elkaar</small></button>
      <button data-v="clock">Tegen de klok<small>Zoveel mogelijk aanwijzen in 60 seconden</small></button>
      <button data-v="type">Alleen typen<small>20 namen, spelling telt</small></button></div></div>
    <div class="row"><button class="btn" id="s">Start</button><button class="btn ghost" id="c">Annuleren</button></div>
  </div></div>`);
  const sync=()=>{ m.querySelectorAll("#what button").forEach(b=>b.classList.toggle("on",b.dataset.v===what)); m.querySelectorAll("#how button").forEach(b=>b.classList.toggle("on",b.dataset.v===how)); };
  m.querySelectorAll("#what button").forEach(b=>b.onclick=()=>{what=b.dataset.v;sync();});
  m.querySelectorAll("#how button").forEach(b=>b.onclick=()=>{how=b.dataset.v;sync();});
  sync(); document.body.appendChild(m);
  m.querySelector("#c").onclick=()=>m.remove();
  m.onclick=e=>{ if(e.target===m) m.remove(); };
  m.querySelector("#s").onclick=()=>{ m.remove(); lastFree.what=what; start(()=>runFree(map,what,how)); };
}

function overview(){
  const p=prof(); $app.innerHTML="";
  // geleerd = in een sessie gehad; vast = daarna in een toets of opwarmer goed (sterkte 2 of hoger)
  const strength=m=>{ const ids=itemsOf(m); const learned=ids.filter(id=>p.items[id]?.seen).length; const vast=ids.filter(id=>p.items[id]?.seen && (p.items[id].s||0)>=2).length; return {learned, vast, total:ids.length}; };
  const hard=weakest(seenIds(null).filter(id=>(p.items[id].w||0)>0),12);
  const done=Object.entries(p.done).sort((a,b)=>a[0]-b[0]);
  const el=h(`<div class="screen res"><div class="wrap">
    <div class="topbar"><div class="brand"><span class="dot"></span><h1>Overzicht ${esc(p.name)}</h1></div><button class="btn ghost small" id="b">Terug</button></div>
    <div class="box"><h3>Hoe goed zit het?</h3>
      ${["nl","eu","world"].map(m=>{ const st=strength(m); const pv=Math.round(100*st.vast/st.total), pl=Math.round(100*(st.learned-st.vast)/st.total);
        return `<div class="ms"><div class="ms-top"><b>${MAPCFG[m].label}</b><span class="num">${st.learned?`<b>${st.learned}</b> geleerd · <b>${st.vast}</b> zitten vast · van ${st.total}`:`nog niet begonnen · ${st.total} plekken`}</span></div>
          <div class="bar2" role="img" aria-label="${st.learned} van ${st.total} geleerd, ${st.vast} zitten vast"><i class="vast" style="width:${pv}%"></i><i class="geleerd" style="width:${pl}%"></i></div></div>`; }).join("")}
      <div class="key"><span><i style="background:var(--ok)"></i>Zit vast: geleerd én daarna in een toets goed</span><span><i style="background:color-mix(in srgb,var(--ok) 35%,transparent)"></i>Geleerd, nog niet getoetst of nog niet goed</span></div>
      <p class="note" style="margin:0">Wat nog niet vastzit komt vanzelf terug in de opwarmers van de volgende sessies.</p></div>
    <div class="box"><h3>Sessies</h3>${done.length?`<div class="chips">${done.map(([n,v])=>`<span class="chip ${v.grade>=5.5?"g":"r"}">${n}. ${esc(SESSIONS[n].title)} · <b class="num">${fmt(v.grade)}</b></span>`).join("")}</div>`:`<p class="note" style="margin:0">Nog geen sessies gedaan.</p>`}</div>
    <div class="box"><h3>Lastigste plekken</h3>${hard.length?`<div class="chips">${hard.map(id=>`<span class="chip o">${esc(dname(I[id]))} <span class="num" style="color:var(--muted)">${p.items[id].w}× fout</span></span>`).join("")}</div>`:`<p class="note" style="margin:0">Nog niets fout. Of nog niets geoefend.</p>`}</div>
    <div class="box"><h3>Extra oefenen</h3><p style="margin:0">${p.free.count ? `${p.free.count} keer, samen ${Math.max(1,Math.round(p.free.sec/60))} min.` : "Nog niet gedaan."} Telt niet mee voor de route.</p></div>
    <div class="box"><h3>Instellingen</h3>
      <label class="row"><input type="checkbox" id="ua" ${p.unlockAll?"checked":""}> Alle sessies openzetten (om alvast te bekijken)</label>
      <div class="row"><button class="btn ghost small" id="reset">Voortgang van ${esc(p.name)} wissen</button></div></div>
  </div></div>`);
  $app.appendChild(el);
  el.querySelector("#b").onclick=home;
  el.querySelector("#ua").onchange=e=>{ p.unlockAll=e.target.checked; Store.save(); };
  el.querySelector("#reset").onclick=()=>{
    const m=h(`<div class="modal-bg"><div class="modal"><h2>Alles wissen?</h2><p>Route, cijfers en records van ${esc(p.name)} gaan weg. Dit kan niet terug.</p><div class="row"><button class="btn" id="y">Wissen</button><button class="btn ghost" id="n">Annuleren</button></div></div></div>`);
    document.body.appendChild(m); m.querySelector("#n").onclick=()=>m.remove();
    m.querySelector("#y").onclick=()=>{ const d=Store.load(); const name=p.name; d.profiles[d.current]=newProfile(name); Store.save(); Store.flush(); m.remove(); overview(); };
  };
}

window.__dbg={I,MapView,SESSIONS,Store};
$app.innerHTML=`<div class="screen home"><div class="wrap"><div class="brand"><span class="dot"></span><h1>Topotrainer</h1></div><p class="note">Even laden…</p></div></div>`;
Store.init().then(()=>home());
</script>

</body>
</html>
